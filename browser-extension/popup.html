<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CU Browser</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main>
      <h1>CU Browser</h1>
      <p id="status" role="status">No tab is granted.</p>
      <p id="capabilities">Capabilities: none</p>
      <div class="controls">
        <button id="start-read" type="button">Read current tab</button>
        <label><input id="cursor" type="checkbox" checked /> Show amber browser cursor</label>
        <button id="start-interaction" type="button">Allow page interaction</button>
        <button id="stop" type="button">Stop</button>
      </div>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
