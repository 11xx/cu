[project]
name = "cu"
version = "0.1.0"
description = "Computer use for Hyprland: see and drive a Wayland desktop from a CLI."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cu = "cu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cu"]
